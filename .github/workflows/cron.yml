name: Random Cron
on:
  workflow_run:
    workflows: ["刷步数"]
    types:
      - completed
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    env:
      STEP_PAT: ${{ secrets.STEP_PAT }}
    steps:
      - name: skip if no STEP_PAT
        if: ${{ env.STEP_PAT == '' }}
        run: echo "STEP_PAT 未配置，跳过随机 cron 与仓库保活"
      - uses: actions/checkout@v5
        if: ${{ env.STEP_PAT != '' }}
        with:
          token: ${{ secrets.STEP_PAT }}
      - name: random cron
        if: ${{ env.STEP_PAT != '' }}
        run: |
          source cron_convert.sh
          echo "configed CRON_HOURS ${{ vars.CRON_HOURS }}"
          persist_execute_log ${{ github.event_name }} ${{ vars.CRON_HOURS }}
          git config user.name step_bot
          git config user.email step_bot@test.com
          git add .
          current=`TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S'`
          git commit -m "[${current}] random cron trigger by ${{ github.event_name }}"
          git push origin main
